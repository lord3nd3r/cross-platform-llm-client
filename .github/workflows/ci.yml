name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Stable-diffusion sources are present
        run: test -n "$(find local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp -type f | head -n 1)"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
