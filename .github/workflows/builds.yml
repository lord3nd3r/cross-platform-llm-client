name: Downloadable builds

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/**'

permissions:
  contents: read

concurrency:
  group: downloadable-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # No release signing key is configured. Keep this explicitly a debug APK.
      - run: flutter build apk --debug --target-platform android-arm64 --build-number "$GITHUB_RUN_NUMBER"
      - name: Package APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/PrivateLM-android-arm64-debug.apk
          cd artifacts
          sha256sum PrivateLM-android-arm64-debug.apk > PrivateLM-android-arm64-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-android-arm64-debug
          path: artifacts/*
          if-no-files-found: error

  macos:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Package macOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/privatelm.app artifacts/PrivateLM-macos.zip
          cd artifacts
          shasum -a 256 PrivateLM-macos.zip > PrivateLM-macos.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-macos
          path: artifacts/*
          if-no-files-found: error
